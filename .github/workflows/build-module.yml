name: Build FoundryVTT Module ZIP

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-module-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out module sources
        uses: actions/checkout@v4

      - name: Build installable FoundryVTT ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json

          root = Path.cwd()
          manifest = root / 'module.json'
          if not manifest.is_file():
              raise SystemExit('Missing module.json in repository root')
          module = json.loads(manifest.read_text(encoding='utf-8'))
          if module.get('id') != 'library-thousandfold':
              raise SystemExit('Unexpected module ID in module.json')

          output = root / 'dist' / 'library-thousandfold.zip'
          output.parent.mkdir(parents=True, exist_ok=True)
          excluded_dirs = {'.git', '.github', 'dist', '__pycache__', '.venv', '.idea', '.vscode'}
          excluded_files = {'.DS_Store', 'Thumbs.db'}
          sources = sorted(
              p for p in root.rglob('*')
              if p.is_file()
              and not p.is_symlink()
              and not any(part in excluded_dirs for part in p.relative_to(root).parts)
              and p.name not in excluded_files
          )
          if not sources:
              raise SystemExit('No module files to package')

          with ZipFile(output, 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for source in sources:
                  archive.write(source, arcname=source.relative_to(root).as_posix())
          with ZipFile(output) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('ZIP integrity test failed')
              if 'module.json' not in archive.namelist():
                  raise SystemExit('ZIP is missing module.json at its root')
          print(f'Created {output.relative_to(root)} ({len(sources)} module files)')
          PY

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-thousandfold-module
          path: dist/library-thousandfold.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit updated ZIP to repository
        shell: bash
        run: |
          git add -- dist/library-thousandfold.zip
          if git diff --cached --quiet; then
            echo 'Module ZIP is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build FoundryVTT module ZIP [skip ci]'
          git push origin HEAD:main
